[project]
name = "rubic-experiments"
version = "0.1.0"
description = "Rubik cube solver prototype experiments (APL-001)"
requires-python = ">=3.11"
dependencies = [
  "kociemba==1.2.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
